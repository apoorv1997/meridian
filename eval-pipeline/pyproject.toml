[project]
name = "meridian-eval"
version = "0.1.0"
description = "Meridian Evaluation Pipeline — OTel trace ingestion, LLM-as-judge scoring, feedback loop"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "sentence-transformers>=3.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "testcontainers[postgres,kafka,redis]>=4.0",
    "fakeredis[lua]>=2.23",  # runs the weight updater's Lua script in tests without Docker
]

[project.scripts]
meridian-eval = "meridian_eval.consumer.trace_consumer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian_eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
