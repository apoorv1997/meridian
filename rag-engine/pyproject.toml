[project]
name = "meridian-rag"
version = "0.1.0"
description = "Meridian RAG Engine — real-time document ingestion and retrieval"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "testcontainers[postgres,kafka]>=4.0",
]

[project.scripts]
meridian-rag-consumer = "meridian_rag.consumer.kafka_consumer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian_rag*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
